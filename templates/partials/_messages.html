{% if messages %}
<div class="container-wide py-4 space-y-2">
  {% for message in messages %}
    <div class="px-4 py-3 rounded border {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-800{% elif message.tags == 'success' %}bg-green-50 border-green-200 text-green-800{% else %}bg-surface2 border-border text-ink{% endif %}">
      {{ message }}
    </div>
  {% endfor %}
</div>
{% endif %}
